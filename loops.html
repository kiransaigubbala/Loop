<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8e1;
            padding: 30px;
        }

        .card {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #ffcc80;
            border-radius: 10px;
            box-shadow: 0px 3px 8px #ccc;
        }

        h1 {
            text-align: center;
            color: #e65100;
            font-size: 24px;
        }

        label {
            display: inline-block;
            width: 100px;
            margin-bottom: 15px;
        }

        input {
            padding: 8px;
            border: 1px solid #aaa;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        button {
            padding: 9px 18px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e65100;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Display Sequence</h1>

        <label>Enter Start</label>
        <input type="number" placeholder="Enter start" id="start">
        <br>

        <label>Enter End</label>
        <input type="number" placeholder="Enter end" id="end">
        <br>

        <button onclick="sequence()">Display Sequence</button>

    </div>

    <script type="text/javascript" src="loops.js"></script>

</body>

</html>
